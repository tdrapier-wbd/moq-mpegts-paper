name: Charts

on:
  push:
    branches: [main]
    paths: &chart-inputs
      - lab/cost-model.py
      - lab/generate_charts.py
      - lab/requirements-charts.txt
      - lab/price_ladder.svg
      - .github/workflows/check-charts.yml
  pull_request:
    paths: *chart-inputs

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: lab/requirements-charts.txt
      - run: pip install -r lab/requirements-charts.txt
      - run: python lab/generate_charts.py --check
