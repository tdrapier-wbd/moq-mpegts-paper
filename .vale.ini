StylesPath = .vale/styles
MinAlertLevel = warning

# `vale sync` downloads the packages into StylesPath; only `config/` is versioned.
Packages = proselint

Vocab = PaperVocab

[*.{md,txt,tex}]
BasedOnStyles = Vale, proselint

# The text names both a crate or command (`moq`, `ffmpeg`) and its project (MoQ, FFmpeg), so the
# vocabulary is a list of spelling exceptions, not enforced capitalisation. Its entries match
# case-insensitively: never add a pattern with a character class.
Vale.Terms = NO

# "(c)" is a list label here, and "a resume" a stream resuming.
proselint.Typography = NO
proselint.Diacritical = NO

# Acronyms in the plural or possessive (PCRs, SRT's, TRACK_STATUS's). Unlike vocabulary entries,
# this match is case-sensitive.
TokenIgnores = (\b[A-Z][A-Z0-9_]+(?:'s|s)\b)
